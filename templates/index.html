{% extends 'layout.html' %} {% block content %}
<!-- Filter Bar -->
<div class="filter-bar">
  <div class="filter-group">
    <button class="filter-chip active" data-filter="">
      <span class="material-symbols-outlined">tune</span>
      All Assets
    </button>
    <button class="filter-chip" data-filter="image">
      <span class="material-symbols-outlined">image</span>
      Images
    </button>
    <button class="filter-chip" data-filter="video">
      <span class="material-symbols-outlined">videocam</span>
      Videos
    </button>
    <button class="filter-chip" data-filter="psd">
      <span class="material-symbols-outlined">palette</span>
      PSD
    </button>
  </div>
  <button class="clear-filters">Clear Filters</button>
</div>

<!-- Content Header -->
<div class="content-header">
  <div class="section-title">
    Recent Discoveries
    <span class="result-badge" id="resultCountBadge">0 Results</span>
  </div>
  
  <div class="content-header-actions">
    <div class="sort-dropdown-wrap">
      <select id="sortDropdown" class="sort-dropdown">
        <option value="date_desc">Latest → Oldest</option>
        <option value="date_asc">Oldest → Latest</option>
        <option value="name_asc">A → Z</option>
        <option value="name_desc">Z → A</option>
      </select>
    </div>
    <div class="view-toggle">
      <button class="view-btn active" id="viewGrid" title="Grid View">
        <span class="material-symbols-outlined">grid_view</span>
      </button>
      <button class="view-btn" id="viewList" title="List View">
        <span class="material-symbols-outlined">view_list</span>
      </button>
    </div>
  </div>
</div>

<!-- Results Grid -->
<section class="results-wrap" role="region" aria-live="polite">
  <!-- Old title removed, using content-header instead -->
  <div id="results" class="grid"></div>
</section>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-content">
    <button id="modalClose" class="modal-close" aria-label="Close">
      ×
    </button>
    <div class="modal-main">
      <div class="modal-header">
        <div>
          <h2 id="modalFilename" class="modal-filename">Filename.jpg</h2>
          <div id="modalFilepath" class="modal-filepath"></div>
        </div>
      </div>
      <div class="modal-image-container">
        <!-- Modal Counter -->
        <div class="modal-counter" id="modalCounter">1 of 1</div>
        <button
          class="modal-nav-btn prev"
          id="modalPrev"
          aria-label="Previous image"
        >
          ‹
        </button>
        <img id="modalImg" alt="Preview" />
        <video id="modalVideo" class="modal-media-hidden" controls preload="metadata"></video>
        <button
          class="modal-nav-btn next"
          id="modalNext"
          aria-label="Next image"
        >
          ›
        </button>

      </div>
    </div>
    <div class="modal-sidebar">
      <div class="modal-sidebar-title">Photo Details</div>

      <div class="modal-detail-group">
        <div class="modal-detail-label">
          <span class="material-symbols-outlined">calendar_today</span>
          Date
        </div>
        <div id="modalDate" class="modal-detail-value">-</div>
      </div>

      <div class="modal-detail-group">
        <div class="modal-detail-label">
          <span class="material-symbols-outlined">event</span>
          Event
        </div>
        <div id="modalEvent" class="modal-detail-value">-</div>
      </div>

      <div class="modal-detail-group">
        <div class="modal-detail-label">
          <span class="material-symbols-outlined">hard_drive</span>
          File Size
        </div>
        <div id="modalSize" class="modal-detail-value">-</div>
      </div>

      <div class="modal-detail-group">
        <div class="modal-detail-label">Full Path</div>
        <div id="modalPath" class="modal-detail-path"></div>
      </div>

      <div class="modal-actions">
        <button id="openBtn" class="btn primary">
          <span class="material-symbols-outlined">folder_open</span>
          Open File Location
        </button>
        <a id="downloadBtn" class="btn" href="#" download>
          <span class="material-symbols-outlined">download</span>
          Download
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
